# Evidence runner — install into the consumer repo as
# `.github/workflows/evidence-run.yml`.
#
# Why this exists rather than running the measurement locally: a validation run is a
# claim that a command produced an output, and the reader has to be able to check that
# without going through the author. A local run's only witness is the author. Every
# failure class this suite has shipped was a local-environment failure — a helper script
# in /tmp, a probe deleted after the run, an absolute path, a toolchain that drifted, a
# contended host producing numbers that had to be retracted.
#
# In CI none of those is expressible. The workflow file is the recipe, the workspace is
# the repo, the run records its own ref, and the run URL is itself the capture —
# `actions/runs/<id>` is what the publish gate accepts.
#
# Trigger from the CLI:
#   gh workflow run evidence-run.yml \
#     -f runner=falsify-probe \
#     -f ref=<sha> \
#     -f args='--test path/to.test.ts --source path/to.ts --line 9 --replace "  return x;"'
#
# Then cite the run URL in the comment. The artifacts are attached to the run; the
# orchestrator reads them to write the finding.
name: Evidence run

'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to execute
        required: true
        type: choice
        options:
          - falsify-probe
          - selector-recompute
          - render-count
          - tsc-substitution
          - capture
      ref:
        description: Commit SHA to measure. Pin it — a branch name makes the run unrepeatable.
        required: true
        type: string
      args:
        description: Arguments passed to the runner, verbatim
        required: true
        type: string
      baseline:
        description: >-
          Second SHA to measure identically. Twice now a run reported "no finding" when it
          had no comparison, so the baseline arm is offered here rather than left to memory.
        required: false
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reject a moving ref
        env:
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.baseline }}
        run: |
          # A branch name makes the artifact unrepeatable, which is the property this
          # workflow exists to provide. Checked before anything is fetched.
          for r in "$REF" ${BASE:+"$BASE"}; do
            case "$r" in
              *[!0-9a-f]* | "") echo "::error::'$r' is not a commit SHA"; exit 1 ;;
            esac
            [ ${#r} -eq 40 ] || { echo "::error::'$r' must be the full 40-char SHA"; exit 1; }
          done

      - name: Checkout at the measured ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2 # the runners diff against the parent

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn --immutable

      # Pinned to a commit, for the same reason the measured ref must be: a branch name
      # makes the run unrepeatable, and "which version of the runner produced this" is
      # exactly the question a reader asks. Override per-repo with the EVIDENCE_SKILLS_REF
      # variable; bump the default when the runners land on the skills repo's main.
      - name: Fetch the runners at a pinned version
        uses: actions/checkout@v6
        with:
          repository: MetaMask/skills
          ref: ${{ vars.EVIDENCE_SKILLS_REF || 'dbc275429d92d00daf4c9138edabe93f526fc26b' }}
          path: .evidence-skills
          sparse-checkout: domains/pr-workflow/skills/evidence/scripts

      - name: Verify the runners arrived
        env:
          RUNNER: ${{ inputs.runner }}
        run: |
          # A sparse checkout of a path that does not exist on the chosen ref succeeds and
          # produces an empty directory, so the next step would fail with "No such file"
          # and no indication that the REF was the problem.
          F=".evidence-skills/domains/pr-workflow/skills/evidence/scripts/$RUNNER.sh"
          [ -f "$F" ] || {
            echo "::error::$RUNNER.sh not present at the pinned skills ref."
            echo "::error::Set the EVIDENCE_SKILLS_REF repository variable to a commit that has it."
            exit 1
          }
          echo "runner $RUNNER.sh sourced from skills @ ${{ vars.EVIDENCE_SKILLS_REF || 'pinned default' }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run
        id: run
        continue-on-error: true # the exit code IS the verdict; a finding is not a failure
        env:
          RUNNER: ${{ inputs.runner }}
          ARGS: ${{ inputs.args }}
        run: |
          RUNNERS=.evidence-skills/domains/pr-workflow/skills/evidence/scripts
          mkdir -p evidence-artifacts
          set +e
          eval "bash \"$RUNNERS/$RUNNER.sh\" $ARGS --label \"$RUNNER-head\" --out evidence-artifacts"
          code=$?
          set -e
          echo "head_exit=$code" >> "$GITHUB_OUTPUT"
          echo "runner exited $code — the exit code is the verdict, not a build failure" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline arm
        if: inputs.baseline != ''
        continue-on-error: true
        env:
          RUNNER: ${{ inputs.runner }}
          ARGS: ${{ inputs.args }}
          BASE: ${{ inputs.baseline }}
        run: |
          git checkout --detach "$BASE"
          yarn --immutable
          RUNNERS=.evidence-skills/domains/pr-workflow/skills/evidence/scripts
          eval "bash \"$RUNNERS/$RUNNER.sh\" $ARGS --label \"$RUNNER-base\" --out evidence-artifacts"

      - name: Determinism check
        # Contention produced numbers that were published and then retracted. Running the
        # head arm twice and diffing costs one repeat and turns that into a pre-publish
        # signal rather than a correction.
        continue-on-error: true
        env:
          RUNNER: ${{ inputs.runner }}
          ARGS: ${{ inputs.args }}
          REF: ${{ inputs.ref }}
        run: |
          RUNNERS=.evidence-skills/domains/pr-workflow/skills/evidence/scripts
          git checkout --detach "$REF"
          eval "bash \"$RUNNERS/$RUNNER.sh\" $ARGS --label \"$RUNNER-repeat\" --out evidence-artifacts" || true
          A="evidence-artifacts/$RUNNER-head.json"
          B="evidence-artifacts/$RUNNER-repeat.json"
          if [ -f "$A" ] && [ -f "$B" ]; then
            # env block differs by design (timing); compare the measurement only
            if diff <(jq -S 'del(.env)' "$A") <(jq -S 'del(.env)' "$B") > determinism.diff; then
              echo "deterministic across two runs" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::runner is NOT deterministic at this ref — do not publish these numbers"
              cat determinism.diff >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Publish the run summary
        if: always()
        run: |
          for f in evidence-artifacts/*.md; do
            [ -f "$f" ] || continue
            { echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.runner }}-${{ inputs.ref }}
          path: |
            evidence-artifacts/**
            determinism.diff
          retention-days: 90
          if-no-files-found: error
